name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]


permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Dockerfiles
        run: |
          test -f docker-basics/Dockerfile
          test -f docker-basics/Dockerfile.app

      - name: Build Web image
        run: docker build -t devops-course-web:ci docker-basics

      - name: Run web container
        run: docker run -d --name ci-web -p 8080:80 devops-course-web:ci

      - name: Test web Application
        run: curl --fail http://localhost:8080

      - name: Tag web image
        run: docker tag devops-course-web:ci ghcr.io/harsha-mahaveer-addanki/devops-course/devops-course-web:latest

      - name: Push web image
        run: docker push ghcr.io/harsha-mahaveer-addanki/devops-course/devops-course-web:latest

      - name: Stop web container
        run: docker rm -f ci-web

      - name: Build app image
        run: docker build -f docker-basics/Dockerfile.app -t devops-course-app:ci docker-basics
